<body>
    <div class="scanlines"></div>
    <div class="tv-frame">
        <div class="tv-screen">
            <h1 id="gameTitle">🗺️ REFUGEE: 1963</h1>
            <div class="main-layout">
                <div class="story-area">
                    <div id="imageContainer" class="image-container" style="display:none;">
                        <img id="sceneImage" class="game-image" src="" alt="Scene">
                        <div id="imageCaption" class="image-caption"></div>
                    </div>
                    <div id="story" class="story"></div>
                    <div id="choices"></div>
                </div>
                <div class="sidebar">
                    <div id="stats"></div>
                </div>
            </div>
        </div>
        <div class="tv-controls">
            <div class="tv-knob" onclick="goBack()" title="Back">⬅️</div>
            <div class="tv-knob" onclick="render(1)" title="Home">🏠</div>
            <div class="tv-knob" onclick="location.reload()" title="Restart">🔄</div>
        </div>
    </div>

    <script>
var G = {
    hp:7, maxHp:10, food:3, maxFood:5, day:1, clues:0, rupees:10,
    origin:'', items:[], allied:'none', special:true, kills:0, helped:0,
    trust:{lion:0,dravida:0,front:0,deccan:0,union:0,ports:0},
    fame:{lion:'Neutral',dravida:'Neutral',front:'Neutral',deccan:'Neutral',union:'Neutral',ports:'Neutral'},
    skills:{combat:0,survival:0,speech:0,stealth:0,medicine:0,trade:0},
    xp:0, level:1, currentImage:'', typeWriterInterval: null,
    pageHistory: [1]
};

// Go back to previous page
function goBack() {
    if(G.pageHistory.length > 1) {
        G.pageHistory.pop(); // Remove current page
        var prevPage = G.pageHistory[G.pageHistory.length - 1];
        render(prevPage);
    } else {
        render(1); // Go to title if no history
    }
}

// Typewriter effect for title on load
window.addEventListener('load', function() {
    var title = document.getElementById('gameTitle');
    var titleText = title.innerText;
    title.innerText = '';
    var i = 0;
    function typeTitle() {
        if (i < titleText.length) {
            title.innerText += titleText.charAt(i);
            i++;
            setTimeout(typeTitle, 50);
        }
    }
    typeTitle();
});

var origins = {
    farmer:{hp:8,food:4,rupees:5,clue:'brother',loc:'Punjab',skills:{survival:3,trade:1}},
    teacher:{hp:6,food:3,rupees:15,clue:'sister',loc:'Dravida',skills:{speech:3,medicine:1}},
    merchant:{hp:5,food:5,rupees:30,clue:'father',loc:'Deccan',skills:{trade:4,speech:1}},
    soldier:{hp:10,food:2,rupees:8,clue:'mother',loc:'Bengal',skills:{combat:4,stealth:1}},
    doctor:{hp:7,food:3,rupees:12,clue:'sister',loc:'Bengal',skills:{medicine:4,survival:1}},
    priest:{hp:6,food:4,rupees:10,clue:'brother',loc:'Deccan',skills:{speech:3,medicine:2}}
};

var relations = {
    lion:{allies:['union'],enemies:['deccan','front']},
    dravida:{allies:['ports'],enemies:['front']},
    front:{allies:[],enemies:['lion','dravida','deccan']},
    deccan:{allies:['union'],enemies:['lion','front']},
    union:{allies:['lion','deccan'],enemies:['front']},
    ports:{allies:['dravida'],enemies:[]}
};

var images = {
    'title': 'title_screen.png',
    'village1': 'village_scene1.png',
    'village2': 'village_scene2.png',
    'checkpoint': 'fac_punjab.png',
    'camp': 'fight_scene.png',
    'crossroads': 'crossroads.png',
    'punjab': 'fac_punjab.png',
    'dravida': 'fac_dravida.png',
    'deccan': 'fac_deccan.png',
    'bengal': 'fight_scene.png',
    'fight': 'fight_scene.png',
    'reunion': 'family_reunion.png',
    'gameover': 'game_over.png',
    'ui1': 'UIelements1.png',
    'ui2': 'Uielements2.png'
};

function modTrust(f,d) {
    G.trust[f] += d;
    G.fame[f] = getFame(G.trust[f]);
    if(d > 0 && relations[f].allies) {
        relations[f].allies.forEach(function(a) { G.trust[a] += Math.floor(d/2); G.fame[a] = getFame(G.trust[a]); });
    }
    if(d > 0 && relations[f].enemies) {
        relations[f].enemies.forEach(function(e) { G.trust[e] -= d; G.fame[e] = getFame(G.trust[e]); });
    }
}

function getFame(t) {
    if(t >= 8) return 'Idolized';
    if(t >= 5) return 'Liked';
    if(t >= 2) return 'Accepted';
    if(t >= 0) return 'Neutral';
    if(t >= -2) return 'Unfriendly';
    if(t >= -3) return 'Hated';
    return 'Vilified';
}

function isHostile(f) { return G.trust[f] <= -3; }

function addXP(amount) {
    G.xp += amount;
    if(G.xp >= G.level * 10) {
        G.level++;
        G.xp = 0;
        return true;
    }
    return false;
}

function increaseSkill(skill, amount) {
    G.skills[skill] += amount;
    if(G.skills[skill] > 10) G.skills[skill] = 10;
}

function checkSkill(skill, difficulty) {
    var roll = Math.random() * 100;
    var skillBonus = G.skills[skill] * 5;
    var target = difficulty;
    var success = roll <= (target + skillBonus);
    return {success: success, roll: Math.floor(roll), target: target + skillBonus};
}

function getSkillName(s) {
    var names = {combat:'Combat', survival:'Survival', speech:'Speech', stealth:'Stealth', medicine:'Medicine', trade:'Trade'};
    return names[s] || s;
}

function showImage(imgKey, caption) {
    var container = document.getElementById('imageContainer');
    var img = document.getElementById('sceneImage');
    var cap = document.getElementById('imageCaption');
    
    if(images[imgKey]) {
        img.onerror = function() {
            container.style.display = 'none';
        };
        img.src = images[imgKey];
        img.alt = imgKey;
        cap.innerText = caption || '';
        container.style.display = 'block';
        G.currentImage = imgKey;
    } else {
        container.style.display = 'none';
    }
}

function init() {
    G = {
        hp:7, maxHp:10, food:3, maxFood:5, day:1, clues:0, rupees:10,
        origin:'', items:[], allied:'none', special:true, kills:0, helped:0,
        trust:{lion:0,dravida:0,front:0,deccan:0,union:0,ports:0},
        fame:{lion:'Neutral',dravida:'Neutral',front:'Neutral',deccan:'Neutral',union:'Neutral',ports:'Neutral'},
        skills:{combat:0,survival:0,speech:0,stealth:0,medicine:0,trade:0},
        xp:0, level:1, currentImage:'', typeWriterInterval: null,
        pageHistory: [1]
    };
}

function render(p) {
    // Track page history for back button
    if(G.pageHistory[G.pageHistory.length - 1] !== p) {
        G.pageHistory.push(p);
    }
    
    // Scroll to top on page change
    window.scrollTo(0, 0);
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
    
    // Hide sidebar on title/lore/howto screens (page 1, 98, 99)
    var sidebar = document.querySelector('.sidebar');
    if(p === 1 || p === 98 || p === 99) {
        sidebar.style.display = 'none';
    } else {
        sidebar.style.display = 'block';
    }
    
    var s = document.getElementById('stats');
    var t = document.getElementById('story');
    var c = document.getElementById('choices');
    
    // Hide choices during typewriter effect
    c.style.display = 'none';
    
    var pg = pages[p];
    if(!pg) return;
    
    // Set image for this scene
    if(pg.image) {
        showImage(pg.image, pg.imageCaption || '');
    }
    
    if(pg.effect) pg.effect();
    
    // Typewriter effect for story text
    var text = typeof pg.text === 'function' ? pg.text() : pg.text;
    t.innerHTML = '';
    
    var i = 0;
    var speed = 15; // ms per character (fast 60s tech feel)
    
    function typeWriter() {
        if (i < text.length) {
            t.innerHTML += text.charAt(i);
            i++;
            G.typeWriterInterval = setTimeout(typeWriter, speed);
        } else {
            finishTyping();
        }
    }
    
    function finishTyping() {
        c.style.display = ''; // Show choices when done
        if(G.typeWriterInterval) clearTimeout(G.typeWriterInterval);
    }
    
    typeWriter();
    
    var skillHtml = '';
    for(var sk in G.skills) {
        var pct = G.skills[sk] * 10;
        skillHtml += '<div class="skill">' + getSkillName(sk) + ':' + G.skills[sk] + 
            '<div class="skill-bar"><div class="skill-fill" style="width:' + pct + '%"></div></div></div> ';
    }
    
    s.innerHTML = '<div class="stat">❤️ HP: ' + G.hp + '/' + G.maxHp + '</div>' +
        '<div class="stat">🍞 Food: ' + G.food + '/' + G.maxFood + '</div>' +
        '<div class="stat">⏳ Day: ' + G.day + '/60</div>' +
        '<div class="stat">🔍 Clues: ' + G.clues + '/3</div>' +
        '<div class="stat">💰 Rs: ' + G.rupees + '</div>' +
        '<div class="stat">⭐ Level: ' + G.level + ' (XP:' + G.xp + '/' + (G.level*10) + ')</div>' +
        '<div class="stat">🎯 Origin: ' + (G.origin||'?') + '</div>' +
        '<div class="stat">🎒 Items: ' + (G.items.join(',')||'none') + '</div>' +
        '<br><hr style="border-color:#333">' +
        '<br><b>📊 SKILLS:</b><br>' + skillHtml +
        '<br><hr style="border-color:#333">' +
        '<br><b>🏛️ REPUTATION:</b><br>' +
        '<div class="stat">🦁 Lion: ' + G.trust.lion + ' (' + G.fame.lion + ')</div>' +
        '<div class="stat">🏛️ Dravida: ' + G.trust.dravida + ' (' + G.fame.dravida + ')</div>' +
        '<div class="stat">✊ Front: ' + G.trust.front + ' (' + G.fame.front + ')</div>' +
        '<div class="stat">🌙 Deccan: ' + G.trust.deccan + ' (' + G.fame.deccan + ')</div>' +
        '<div class="stat">🕉️ Union: ' + G.trust.union + ' (' + G.fame.union + ')</div>' +
        '<div class="stat">⚓ Ports: ' + G.trust.ports + ' (' + G.fame.ports + ')</div>';
    
    if(G.hp <= 0 && p !== 999) { render(999); return; }
    
    c.innerHTML = '';
    var ch = typeof pg.choices === 'function' ? pg.choices() : pg.choices;
    ch.forEach(function(x) {
        if(x.cond && !x.cond()) return;
        var b = document.createElement('div');
        b.className = 'btn';
        b.innerText = '> ' + x.text;
        if(x.skillCheck) {
            b.innerText += ' [' + getSkillName(x.skillCheck.skill) + ' check]';
        }
        b.onclick = function() {
            if(x.skillCheck) {
                var result = checkSkill(x.skillCheck.skill, x.skillCheck.difficulty);
                if(result.success) {
                    t.innerText += '\n\n✅ SKILL CHECK: ' + getSkillName(x.skillCheck.skill).toUpperCase() + 
                        ' - SUCCESS! (Rolled ' + result.roll + ' vs ' + result.target + ')';
                    if(x.effect) x.effect();
                    if(x.onSuccess) x.onSuccess();
                    addXP(3);
                    increaseSkill(x.skillCheck.skill, 1);
                } else {
                    t.innerText += '\n\n❌ SKILL CHECK: ' + getSkillName(x.skillCheck.skill).toUpperCase() + 
                        ' - FAILED (Rolled ' + result.roll + ' vs ' + result.target + ')';
                    if(x.onFail) x.onFail();
                }
            } else {
                if(x.effect) x.effect();
            }
            if(x.origin) {
                G.origin = x.origin;
                var o = origins[x.origin];
                G.hp = o.hp; G.food = o.food; G.rupees = o.rupees;
                for(var sk in o.skills) {
                    increaseSkill(sk, o.skills[sk]);
                }
            }
            render(x.next);
        };
        c.appendChild(b);
    });
}

var pages = {

    },

                    'Trails cold. Family moved on.\n\n' +
                    'You stand at empty house.\n' +

                'You searched everywhere.\n' +
                'Found nothing.\n\n' +
                'What now?';

                'You find a home. In the fractured land,\n' +
                'a small peace.\n\n' +
                'The war continues. But not for you.\n\n' +
                '=== FINAL STATS ===\n' +
                '⭐ Level: ' + G.level + '\n' +

                '🥷 Stealth: ' + G.skills.stealth + '\n' +
                '🏥 Medicine: ' + G.skills.medicine + '\n' +
                '💰 Trade: ' + G.skills.trade + '\n\n' +
                '★★★★★ BEST ENDING ★★★★★';

    701: { 
        image: 'reunion',
        text: '📖 **** PARTIAL REUNION ****\n\n' +
            'Some came home. Others didn\'t.\n\n' +
            'You rebuild. Slowly.\n' +
            'With those who remain.\n\n' +
            'The missing are remembered.\n' +
            'The found are cherished.\n\n' +
            '★★★★☆ GOOD ENDING',
        choices: [{text:'🔄 PLAY AGAIN', next:1, effect:init}]

    702: { 
        image: 'gameover',
        imageCaption: 'Too Late',
        text: '⚰️ ** TOO LATE **\n\n' +
            '60 days passed.\n' +
            'The trail went cold.\n\n' +
            'Maybe they\'re alive. Maybe not.\n' +
            'You\'ll never know.\n\n' +
            'You walk away. Haunted.\n\n' +
            '★★☆☆☆ BAD ENDING',
        choices: [{text:'🔄 PLAY AGAIN', next:1, effect:init}]

    703: { 
        text: '🚶 *** WANDERER ***\n\n' +
            'You walk. No destination.\n' +
            'No family. No faction.\n\n' +
            'India is broken. You are free.\n\n' +
            'Some say you became a myth.\n' +
            'The Ghost of the Grand Trunk Road.\n\n' +
            '★★★☆☆ NEUTRAL ENDING',
        choices: [{text:'🔄 PLAY AGAIN', next:1, effect:init}] 
    },
    900: { 
        text: '🏠 *** SETTLED ***\n\n' +
            'You chose safety over search.\n' +
            'Stability over hope.\n\n' +
            'Years pass. You never forget.\n' +
            'But you live.\n\n' +
            'In 1963, that was enough.\n\n' +
            '★★★☆☆ NEUTRAL ENDING',
        choices: [{text:'🔄 PLAY AGAIN', next:1, effect:init}] 
    },
    999: {
        image: 'gameover',
        imageCaption: 'Your Journey Ends',
        text: function() {
            return '💀 ***** GAME OVER ***** 💀\n\n' +
                'Your journey ends here.\n\n' +
                'Another refugee. Another story\n' +

                '💀 Kills: ' + G.kills + '\n' +
                '❤️ Helped: ' + G.helped + '\n\n' +
                'Rest in Power.';

        choices: [{text:'🔄 TRY AGAIN', next:1, effect:init}]
    }
};
